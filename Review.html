<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>

  :root {
    --surface: #000000;
    --card: #202429;
    --border: #2e3338;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--surface);
    color: var(--brand-50);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 28px; padding: 24px;
  }
  img { image-rendering: pixelated; }

  .site-header {
    position: fixed; top: 0; left: 0; right: 0;
    background: var(--card); border-bottom: 2px solid var(--border);
    padding: 14px 28px; display: flex; justify-content: space-between; align-items: center;
  }
  .site-header img { height: 36px; width: auto; image-rendering: auto; display: block; }
  .site-header span {
    font-family: var(--sans); font-weight: 600; font-size: 15px;
    letter-spacing: .08em; color: #ffffff;
  }

  /* Small loading line on top */
  .loading-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .loading {
    font-family: var(--sans); font-weight: 500;
    font-size: 20px; color: #e5e7e9; letter-spacing: .06em; line-height: 1.3;
  }
  .dots span { opacity: 0; animation: dot 1.4s steps(1) infinite; }
  .dots span:nth-child(2) { animation-delay: .25s; }
  .dots span:nth-child(3) { animation-delay: .5s; }
  @keyframes dot { 0% {opacity:0} 20% {opacity:1} 80% {opacity:1} 100% {opacity:0} }


  /* Name card: one column, rows stacked */
  .name-card {
    width: min(380px, 100%);
    background: var(--card);
    border: 3px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 0 0 3px #000, 0 0 0 5px var(--border);
    overflow: hidden;
  }
  .card-title {
    font-family: var(--sans); font-weight: 600;
    font-size: 16px; letter-spacing: .12em; color: #e5e7e9;
    background: var(--card); border-bottom: 2px solid var(--border);
    padding: 12px 16px; text-align: center;
  }
  .row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 18px;
    border-top: 2px solid var(--border);
  }
  .card-title + .row { border-top: none; }
  .row .icon {
    flex: none; width: 56px; height: 56px;
    background: #000; border: 2px solid var(--border); border-radius: 4px;
    display: grid; place-items: center; overflow: hidden;
  }
  .row .icon img { width: 100%; height: 100%; object-fit: contain; }
  .row .icon.small img { width: 40px; height: 40px; }
  .row .text { display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0; }
  .label { font-family: var(--sans); font-weight: 600; font-size: 11px; color: #8b9299; letter-spacing: .14em; }
  .value { font-family: var(--sans); font-weight: 500; font-size: 22px; color: #ffffff; line-height: 1.2; }

  /* Start button */
  .start {
    font-family: var(--sans); font-weight: 600;
    font-size: 16px; padding: 14px 56px; letter-spacing: .14em;
    background: var(--card); color: #e5e7e9;
    border: 2px solid #e5e7e9; box-shadow: 0 5px 0 #2e3338;
    cursor: pointer; opacity: .35; pointer-events: none;
    transition: transform .08s, box-shadow .08s, background .15s;
    animation: ready .1s 3.5s forwards;
  }
  @keyframes ready { to { opacity: 1; pointer-events: auto; } }
  .start:hover { background: #000; }
  .start:active { transform: translateY(4px); box-shadow: 0 1px 0 #2e3338; }
</style>
</head>
